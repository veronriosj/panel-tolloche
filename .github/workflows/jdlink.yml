name: Flota (cada 1 hora)

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: jdlink
  cancel-in-progress: false

jobs:
  flota:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Consultar flota
        env:
          DEERE_CLIENT_ID: ${{ secrets.DEERE_CLIENT_ID }}
          DEERE_CLIENT_SECRET: ${{ secrets.DEERE_CLIENT_SECRET }}
          DEERE_REFRESH_TOKEN: ${{ secrets.DEERE_REFRESH_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
          REPO: ${{ github.repository }}
        run: |
          pip install --quiet pynacl requests
          python fetch_jdlink.py

      - name: Guardar data/jdlink.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/jdlink.json
          git diff --cached --quiet && exit 0
          git commit -m "flota: actualizar datos"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
